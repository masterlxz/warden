[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
indicatif = "0.18"
owo-colors = "4"
rustyline = "18"
termimad = "0.35"
tokio.workspace = true
warden-bootstrap = { path = "../warden-bootstrap" }
warden-core = { path = "../warden-core" }
