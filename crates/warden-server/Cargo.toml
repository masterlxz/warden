[package]
name = "warden-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
futures-util = "0.3"
# Request-head parsing for the web UI (P78) — already in the tree via tungstenite.
httparse = "1"
# `ring` picked explicitly, same reason as warden-server-protocol's `src/tls.rs`.
# `web/dist` compiled into the binary (P78); `allow_missing` so a checkout without an npm build still compiles.
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# P105: the HMAC of a signed webhook call (`webhook_signature.rs`). 0.12 pairs with sha2 0.10.
hmac = "0.12"
tokio ={ workspace = true, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30"
# P84 fatia 4: the members' file in a backup (`member_backup.rs`).
toml.workspace = true
warden-bootstrap = { path = "../warden-bootstrap" }
warden-truthid = { path = "../warden-truthid" }
warden-core = { path = "../warden-core" }
warden-server-protocol = { path = "../warden-server-protocol" }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
# Throwaway CA + leaf certs for the TLS tests (tests/tls.rs) — `ring` backend, same as rustls here.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
