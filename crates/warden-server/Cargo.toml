[package]
name = "warden-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden-server"
path = "src/main.rs"

[[bin]]
name = "warden-node"
path = "src/bin/warden-node.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
futures-util = "0.3"
# `ring` picked explicitly, same reason as warden-server-protocol's `src/tls.rs`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio ={ workspace = true, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30"
warden-bootstrap = { path = "../warden-bootstrap" }
warden-core = { path = "../warden-core" }
warden-server-protocol = { path = "../warden-server-protocol" }

[dev-dependencies]
# Throwaway CA + leaf certs for the TLS tests (tests/tls.rs) — `ring` backend, same as rustls here.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
