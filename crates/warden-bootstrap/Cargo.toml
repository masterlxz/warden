[package]
name = "warden-bootstrap"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
# `time` only: the approval prompt in `manage_agents` gives up after a deadline.
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
# P82: saving `config.toml` without dropping the user's comments (`config_file.rs`).
toml_edit.workspace = true
warden-core = { path = "../warden-core" }
warden-server-protocol = { path = "../warden-server-protocol" }
warden-sync = { path = "../warden-sync" }

[dev-dependencies]
tokio.workspace = true
