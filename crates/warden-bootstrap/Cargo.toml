[package]
name = "warden-bootstrap"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
# P84: members' passwords, stored only as an Argon2id hash in `[[users]]`.
argon2 = "0.5"
async-trait.workspace = true
# P84 fatia 4: a member's key and recovery code are kept wrapped as base64 text in `config.toml`.
base64.workspace = true
# P92: scheduled tasks — cron expressions, and the IANA time zone a task runs in.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
croner = "4"
dirs.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
# `time` only: the approval prompt in `manage_agents` gives up after a deadline.
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
# P82: saving `config.toml` without dropping the user's comments (`config_file.rs`).
toml_edit.workspace = true
# P84 fatia 4: wipes a member's key from memory when it's no longer in use.
zeroize = "1"
# P84 fatia 4 parte B: the owner's recovery key is a secp256k1 pair (`recovery.rs`), sealed to with the
# ECIES `warden-truthid` already has (both are already in the tree through `warden-sync`).
k256 = "0.13"
warden-truthid = { path = "../warden-truthid" }
warden-core = { path = "../warden-core" }
warden-server-protocol = { path = "../warden-server-protocol" }
warden-sync = { path = "../warden-sync" }

[dev-dependencies]
tokio.workspace = true
