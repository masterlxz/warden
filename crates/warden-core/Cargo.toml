[package]
name = "warden-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-stream = "0.3"
async-trait.workspace = true
eventsource-stream = "0.2"
futures-core = "0.3"
futures-util = "0.3"
http.workspace = true
reqwest.workspace = true
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
# Needed only to construct a `reqwest::Client` value to hand to rmcp's OAuth `AuthClient`
# (tool/mcp_oauth.rs) — rmcp's `auth`/`reqwest` features don't re-export their internal
# `reqwest::Client` type at any public path, so naming it requires depending on the exact same
# reqwest major ourselves; Cargo unifies this with rmcp's own dependency into one compiled
# instance. Same trade-off already accepted in Sessão 36 for the HTTP MCP transport (a second
# reqwest major alongside our own `reqwest.workspace` 0.12), just extended — see ARCHITECTURE.md.
reqwest-oauth = { package = "reqwest", version = "0.13.2" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# All three optional, gated behind the `semantic-search` feature below (default-on) — `ort` (fastembed's
# ONNX runtime) has no prebuilt binary for `armv7-linux-androideabi`, so any crate that cross-
# compiles for Android (`warden-mobile-bridge`, via `warden-sync`) needs a way to depend on
# `warden-core` WITHOUT pulling this in, even though it never calls `Vault::search_semantic`.
# `default-features = false` + explicit rustls features on fastembed itself: its own defaults pull
# in `native-tls`/`openssl-sys` (for both `ort`'s model-download and `hf-hub`'s HTTP client), which
# — independently of the Android prebuilt-binary gap above — also can't cross-compile without a
# target-specific OpenSSL build. Every other HTTP client in the workspace already standardizes on
# rustls (see `reqwest.workspace`'s `rustls-tls` feature in the root Cargo.toml); this keeps
# fastembed consistent with that instead of being the one exception.
fastembed = { version = "6.0.3", optional = true, default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "image-models",
] }
# Pinned to 0.10 to match the version already used by warden-sync/warden-truthid (avoids a second
# sha2 major compiling into the workspace) — `cargo add` defaults to the newest 0.11 otherwise.
sha2 = { version = "0.10", optional = true }
dirs = { workspace = true, optional = true }
# generate_document's PDF support (P64 fatia 3). Chosen over `printpdf` (its current major dropped
# base-14-font support and now requires embedding a TTF/OTF asset just to write plain text — a
# licensing/binary-asset question we don't need) — `lopdf` writes PDFs referencing a standard
# Helvetica font directly, no font embedding needed, and is itself printpdf's own low-level
# backend. Pure Rust, no OpenSSL/native-tls in its dependency tree, same rationale already applied
# to `fastembed` above and to choosing git shell-out over `git2` in P63.
lopdf = "0.45"

[features]
default = ["semantic-search"]
# Fase 4.5 — local embedding-based vault search (`Vault::search_semantic`). Off by default for a
# crate that depends on `warden-core` only for non-model plumbing (e.g. `warden-sync`, which pulls
# in `Vault` purely for file I/O, not chat) — see the fastembed comment above for why this needs to
# be optional at all rather than just always-on.
semantic-search = ["dep:fastembed", "dep:sha2", "dep:dirs"]

[dev-dependencies]
# `transport-io` (plain stdio, used to play the *server* side against a real child process in
# tests/mcp_stdio.rs) is dev-only — the shipped binary only ever needs the client side. Same for
# `server`/`macros`/`transport-streamable-http-server` (tests/mcp_http.rs: a real local HTTP MCP
# server, to test `McpToolProvider::connect_http` against something real rather than mocked).
rmcp = { version = "3", features = ["transport-io", "server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
