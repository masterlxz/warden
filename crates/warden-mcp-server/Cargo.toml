[package]
name = "warden-mcp-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
# "server" + "transport-io" here are real product dependencies (unlike warden-core, where the
# same features are dev-only — there they only play the server side of a test).
rmcp = { version = "3", features = ["server", "transport-io"] }
serde_json.workspace = true
tokio.workspace = true
warden-bootstrap = { path = "../warden-bootstrap" }
warden-core = { path = "../warden-core" }
