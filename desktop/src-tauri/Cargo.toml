[package]
name = "desktop"
version.workspace = true
description = "Warden desktop app (Tauri)"
authors = ["you"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64.workspace = true
dirs.workspace = true
# Native mic capture for voice input (P28) — sidesteps a known Tauri/wry limitation on Linux
# where WebKitGTK denies every `getUserMedia` request by default (the app would need to hand-wire
# WebKit's `permission-request` GObject signal itself, unsupported by Tauri: see
# https://github.com/tauri-apps/tauri/issues/12547). Recording in the Rust backend instead avoids
# the webview permission system entirely, and works the same on Windows/macOS too.
cpal = "0.18"
hound = "3.5"
qrcode = "0.14"
warden-bootstrap = { path = "../../crates/warden-bootstrap" }
warden-core = { path = "../../crates/warden-core" }
warden-server = { path = "../../crates/warden-server" }
warden-sync = { path = "../../crates/warden-sync" }

